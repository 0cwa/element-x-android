name: Widget host validation

on:
  pull_request:
    branches: [widget-support]
    paths: ['.github/workflows/widget-host-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    if: github.repository == '0cwa/element-x-android' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source for offline review
        run: git archive --format=tar.gz --output=widget-source.tar.gz HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: widget-source
          path: widget-source.tar.gz
          retention-days: 3
