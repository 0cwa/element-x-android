name: Widget host validation

on:
  pull_request:
    branches: [widget-support]
    paths: ['.github/workflows/widget-host-validation.yml']

permissions:
  contents: read

concurrency:
  group: widget-host-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-reviewed-source:
    if: github.repository == '0cwa/element-x-android' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'widget-host-validation-2026-10-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8666f9f2d20f30fbe5a592f681d52988589db7dd
          persist-credentials: false
      - name: Export tracked public source only
        run: |
          test "$(git rev-parse HEAD)" = 8666f9f2d20f30fbe5a592f681d52988589db7dd
          git ls-files -z | tar --null --verbatim-files-from --no-recursion -czf "$RUNNER_TEMP/widget-reviewed-source.tar.gz" -T -
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: widget-reviewed-source
          path: |
            ${{ runner.temp }}/widget-reviewed-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 3
          if-no-files-found: error
