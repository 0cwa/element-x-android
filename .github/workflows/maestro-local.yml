name: Maestro (local)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Actions environment containing the Maestro account settings (optional)
        type: environment
        required: false
  pull_request:

permissions: {}

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache
  ARCH: x86_64
  DEVICE: pixel_7_pro
  API_LEVEL: 33
  TARGET: google_apis

jobs:
  maestro-configuration:
    name: Check Maestro configuration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || vars.MAESTRO_ENVIRONMENT || 'maestro' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin every job to this run's immutable commit, including queued jobs.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test Maestro configuration and artifact helpers
        run: python3 -m unittest discover -s .github/workflows/scripts/maestro -v
      - &maestro_configuration
        name: Validate Maestro account configuration
        id: maestro_config
        env:
          # Resolve the configured account after the job's environment is available.
          # The room and invitees retain the existing test fixtures as defaults.
          MAESTRO_USERNAME: ${{ secrets.MAESTRO_USERNAME }}
          MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD || secrets.MATRIX_MAESTRO_ACCOUNT_PASSWORD }}
          MAESTRO_RECOVERY_KEY: ${{ secrets.MAESTRO_RECOVERY_KEY || secrets.MATRIX_MAESTRO_ACCOUNT_RECOVERY_KEY }}
          MAESTRO_ROOM_NAME: ${{ secrets.MAESTRO_ROOM_NAME || vars.MAESTRO_ROOM_NAME || secrets.MATRIX_MAESTRO_ACCOUNT_ROOM_NAME || vars.MATRIX_MAESTRO_ACCOUNT_ROOM_NAME || secrets.MATRIX_MAESTRO_ROOM_NAME || vars.MATRIX_MAESTRO_ROOM_NAME || 'MyRoom' }}
          MAESTRO_INVITEE1_MXID: ${{ secrets.MAESTRO_INVITEE1_MXID || vars.MAESTRO_INVITEE1_MXID || secrets.MATRIX_MAESTRO_ACCOUNT_INVITEE1_MXID || vars.MATRIX_MAESTRO_ACCOUNT_INVITEE1_MXID || secrets.MATRIX_MAESTRO_INVITEE1_MXID || vars.MATRIX_MAESTRO_INVITEE1_MXID || '@maestroelement2:matrix.org' }}
          MAESTRO_INVITEE2_MXID: ${{ secrets.MAESTRO_INVITEE2_MXID || vars.MAESTRO_INVITEE2_MXID || secrets.MATRIX_MAESTRO_ACCOUNT_INVITEE2_MXID || vars.MATRIX_MAESTRO_ACCOUNT_INVITEE2_MXID || secrets.MATRIX_MAESTRO_INVITEE2_MXID || vars.MATRIX_MAESTRO_INVITEE2_MXID || '@maestroelement3:matrix.org' }}
          MAESTRO_HOMESERVER: ${{ secrets.MAESTRO_HOMESERVER || vars.MAESTRO_HOMESERVER }}
          MAESTRO_APP_ID: io.element.android.x.debug
          MAESTRO_CLEANUP_SESSIONS: ${{ vars.MAESTRO_CLEANUP_SESSIONS || (github.repository == 'element-hq/element-x-android' && 'true') || 'false' }}
        run: bash .github/workflows/scripts/maestro/prepare-env.sh

  build-apk:
    name: Build APK
    needs: [ maestro-configuration ]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || vars.MAESTRO_ENVIRONMENT || 'maestro' }}
    outputs:
      location_sharing_enabled: ${{ steps.assemble.outputs.location_sharing_enabled }}
    # Secrets are not available to pull_request runs from forks, so the Maestro job below
    # cannot run for them; skip the build too, as its only consumer is that job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ${{ format('maestro-build-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: true
          # All of these default to true, but we should only need the 'android' one (and maybe swap-storage?)
          android: false
          dotnet: true
          haskell: true
          # This takes way too long to run (~2 minutes) and it saves only ~5.5GB
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the same immutable commit used by configuration and tests.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        name: Use JDK 21
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true # Only the debug build and unit tests jobs write the Gradle cache, see build.yml
      - name: Assemble debug APK
        id: assemble
        run: |
          # Match buildTimeMapTilerConfig(): location sharing needs a nonempty API key.
          # Export only the capability, never the provider key, to the test job.
          if [[ -n "$ELEMENT_ANDROID_MAPTILER_API_KEY" ]]; then
            echo "location_sharing_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "location_sharing_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
      - name: Upload APK as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elementx-apk-maestro
          path: |
            app/build/outputs/apk/gplay/debug/app-gplay-x86_64-debug.apk
          retention-days: 5
          overwrite: true
          if-no-files-found: error

  maestro-cloud:
    name: Maestro test suite
    runs-on: ubuntu-latest
    needs: [ build-apk ]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || vars.MAESTRO_ENVIRONMENT || 'maestro' }}
    timeout-minutes: 45
    env:
      MAESTRO_LOCATION_SHARING_ENABLED: ${{ needs.build-apk.outputs.location_sharing_enabled }}
    # Allow only one to run at a time, since they use the same environment.
    # Otherwise, tests running in parallel can break each other.
    # queue: max lets several runs wait their turn instead of the default, where a
    # newly queued run cancels the one already pending (that run then never gets a verdict).
    concurrency:
      group: maestro-test
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued test must use the flows from the commit that built its APK.
          ref: ${{ github.sha }}
          persist-credentials: false
      - *maestro_configuration
      - name: Report location-sharing coverage
        run: |
          if [[ "$MAESTRO_LOCATION_SHARING_ENABLED" == true ]]; then
            echo "Location-sharing tests are enabled: this APK has a MapTiler provider." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Location-sharing tests are omitted: this APK has no MapTiler provider because MAPTILER_KEY is unset." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download APK artifact from previous job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elementx-apk-maestro
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro tests in emulator
        id: maestro_test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.DEVICE }}
          target: ${{ env.TARGET }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 3G
          script: |
            .github/workflows/scripts/maestro/maestro-local-with-screen-recording.sh app-gplay-x86_64-debug.apk
      - name: Set up Python
        if: ${{ always() && steps.maestro_config.outcome == 'success' && env.MAESTRO_CLEANUP_SESSIONS == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.15
      - name: End all the remaining sessions of the Maestro account
        if: ${{ always() && steps.maestro_config.outcome == 'success' && env.MAESTRO_CLEANUP_SESSIONS == 'true' }}
        continue-on-error: true
        run: |
          pip install requests
          MAS_PASSWORD="$MAESTRO_PASSWORD" python3 ./tools/mas/delete_all_sessions.py \
            --homeserver "$MAESTRO_HOMESERVER" --username "$MAESTRO_USERNAME"
      - name: Prepare redacted test diagnostics
        id: maestro_artifacts
        if: ${{ always() && steps.maestro_config.outcome == 'success' }}
        run: python3 .github/workflows/scripts/maestro/sanitize-artifacts.py "$HOME/.maestro/tests" build/maestro-artifacts
      - name: Upload test results
        if: ${{ always() && steps.maestro_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/maestro-artifacts/**
          retention-days: 5
          overwrite: true
          if-no-files-found: warn
      - name: Update summary (success)
        if: ${{ always() && steps.maestro_test.outcome == 'success' }}
        run: |
          echo "### Maestro tests worked :rocket:!" >> $GITHUB_STEP_SUMMARY
      - name: Update summary (failure)
        if: ${{ always() && steps.maestro_test.outcome != 'success' }}
        run: |
          echo "### Maestro tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the configuration and emulator steps, then download the redacted test-results artifact if available." >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the workflow in case of error in test
        if: ${{ always() && steps.maestro_test.outcome != 'success' }}
        run: |
          echo "Maestro tests failed. Please check the logs."
          exit 1
