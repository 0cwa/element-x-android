appId: ${MAESTRO_APP_ID}
---
- tapOn: "Sign in manually"
- runFlow: ../assertions/assertLoginDisplayed.yaml
- takeScreenshot: build/maestro/100-SignIn
# Select the configured MAS-backed account provider; local runs default to matrix.org.
- tapOn:
    id: "change_server-server"
- eraseText
- inputText: '${typeof MAESTRO_HOMESERVER === "undefined" || !MAESTRO_HOMESERVER ? "matrix.org" : MAESTRO_HOMESERVER}'
- hideKeyboard
- tapOn:
    id: "login-continue"
## MAS page
# Click on "Use another account" if MAS is already logged in:
- runFlow:
    when:
      visible: "Use another account"
    commands:
      - tapOn:
          text: "Use another account"
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible:
            id: "form-1"
          timeout: 10000
- tapOn:
    id: "form-1"
- inputText: ${MAESTRO_USERNAME}
- pressKey: Enter
- tapOn:
    id: "form-3"
- inputText: ${MAESTRO_PASSWORD}
- pressKey: Enter
- tapOn: "Continue"
## Report a rejected login immediately instead of timing out on a later native screen.
- extendedWaitUntil:
    visible: "Confirm your digital identity|Invalid credentials"
    timeout: 60000
- assertNotVisible: "Invalid credentials"
## Back to native world
- runFlow: ../assertions/assertSessionVerificationDisplayed.yaml
- runFlow: ./verifySession.yaml
- runFlow: ../assertions/assertAnalyticsDisplayed.yaml
- tapOn: "Not now"
- runFlow: ../assertions/assertHomeDisplayed.yaml
